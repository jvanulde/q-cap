name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable 2026-10-09
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - run: |
          cd services/qcap-registry
          go build ./...
          go test -race ./...
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: sdks/ts/package-lock.json
      - run: npm ci
        working-directory: sdks/ts
      - run: npm run build
        working-directory: sdks/ts
  demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable 2026-10-09
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.21"
      - run: powershell -ExecutionPolicy Bypass -File scripts/demo.ps1
      - run: powershell -ExecutionPolicy Bypass -File scripts/integration-registry.ps1
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - name: Build registry image
        run: docker build -t qcap-registry:test services/qcap-registry
      - name: Exercise registry container
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --publish 18080:8080 --env QCAP_REGISTRY_TOKEN=test-token qcap-registry:test)
          trap 'docker logs "$container_id"; docker rm --force "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health > /tmp/qcap-health.json; then
              grep -q '"status":"ok"' /tmp/qcap-health.json
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Validate Compose configuration
        env:
          QCAP_REGISTRY_TOKEN: test-token
        run: docker compose -f compose.yaml config --quiet
      - name: Validate Helm chart
        run: |
          helm lint deploy/helm/qcap-registry --set auth.token=test-token
          helm template qcap-registry deploy/helm/qcap-registry \
            --set auth.token=test-token \
            --set image.repository=qcap-registry \
            --set image.tag=test > /tmp/qcap-registry.yaml
