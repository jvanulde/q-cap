services:
  registry:
    build:
      context: ./services/qcap-registry
      dockerfile: Dockerfile
    image: qcap-registry:local
    restart: unless-stopped
    ports:
      - "${QCAP_REGISTRY_PORT:-8080}:8080"
    environment:
      QCAP_REGISTRY_ADDR: ":8080"
      QCAP_REGISTRY_STORE: /var/lib/qcap
      QCAP_REGISTRY_INDEX: /var/lib/qcap/index.json
      QCAP_REGISTRY_TOKEN: "${QCAP_REGISTRY_TOKEN:-}"
    volumes:
      - qcap-registry-data:/var/lib/qcap
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  qcap-registry-data:
